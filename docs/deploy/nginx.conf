# ─────────────────────────────────────────────────────────────────────────────
# Enterprise Georgia (gedc) — /etc/nginx/sites-available/default
#
# Routing:
#   /socket.io/  → localhost:4000  (Socket.IO — visitor chat + operator DMs)
#   /uploads/    → localhost:4000  (backend-served static files)
#   /api         → localhost:4000  (NestJS REST API)
#   /cms         → localhost:3001  (Next.js CMS, basePath: '/cms')
#   /            → localhost:3000  (Next.js public website, catch-all)
#
# The following are already in /etc/nginx/nginx.conf http block — do NOT add here:
#   map $http_upgrade $connection_upgrade { ... }
#   limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# ─────────────────────────────────────────────────────────────────────────────

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# Main server — HTTPS
# Self-signed cert (IP-only phase).
# Switch ssl_certificate paths and enable ssl_stapling after certbot.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_stapling        on;       # enable after switching to a real CA cert
    # ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN                                     always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header X-XSS-Protection          "1; mode=block"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;

    # ── Compression ───────────────────────────────────────────────────────────
    # gzip on is set globally in nginx.conf; extend types and tuning here.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Shared proxy defaults ─────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    client_max_body_size 50M;

    # ── Socket.IO — visitor/operator chat ─────────────────────────────────────
    # Declared before /api so the longer prefix wins.
    # All proxy_set_header directives must be repeated here: nginx drops server-
    # level proxy_set_header inheritance the moment a location adds its own.
    location /socket.io/ {
        proxy_pass http://localhost:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log /var/log/nginx/backend.access.log;
        error_log  /var/log/nginx/backend.error.log;
    }

    # ── Backend static uploads ────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://localhost:4000;
        expires    7d;
        add_header Cache-Control "public";
        access_log /var/log/nginx/backend.access.log;
        error_log  /var/log/nginx/backend.error.log;
    }

    # ── Backend REST API ──────────────────────────────────────────────────────
    location /api {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://localhost:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        access_log /var/log/nginx/backend.access.log;
        error_log  /var/log/nginx/backend.error.log;
    }

    # ── CMS Next.js built assets (content-hashed, served directly from disk) ──
    location /cms/_next/static/ {
        alias /opt/cms/Enterprise_CMS/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── CMS public directory assets ───────────────────────────────────────────
    location /cms/images/ {
        alias /opt/cms/Enterprise_CMS/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /cms/uploads/ {
        alias /opt/cms/Enterprise_CMS/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── CMS admin dashboard ───────────────────────────────────────────────────
    # CMS .env MUST have: NEXT_PUBLIC_BASE_PATH=/cms
    location /cms {
        proxy_pass http://localhost:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        access_log /var/log/nginx/cms.access.log;
        error_log  /var/log/nginx/cms.error.log;
    }

    # ── Next.js built assets (content-hashed, served directly from disk) ─────
    location /_next/static/ {
        alias /opt/frontend/Enterprise-georgia-NFront/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Public directory assets (icons, images, fonts) ────────────────────────
    location /assets/ {
        alias /opt/frontend/Enterprise-georgia-NFront/public/assets/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Public website — catch-all ────────────────────────────────────────────
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://localhost:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        access_log /var/log/nginx/frontend.access.log;
        error_log  /var/log/nginx/frontend.error.log;
    }
}
